name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check all JS
        run: |
          for f in app.js data.js sw.js; do node --check "$f"; done
          for f in tests/*.mjs; do node --check "$f"; done

      - name: Install dev dependencies (jsdom)
        run: npm install --no-save jsdom

      - name: Run tests
        run: npm test
