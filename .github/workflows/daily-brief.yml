name: daily-brief

# Delivery target: ~05:05 America/Denver (11:05 UTC during MDT).
# GitHub `schedule` events queue at peak times (observed 1.5-3h late), so the
# ON-TIME path is the "daily-brief trigger" Claude cloud routine, which fires
# workflow_dispatch (or pushes .github/trigger/daily-brief) at 11:00 UTC
# sharp — 30 min after the 10:30 UTC "Nature Daily Brief" routine has drafted
# today's digest in Gmail.
# The cron below is only a FALLBACK: 12:23 UTC (off-peak minute), typically
# delayed to ~6:30-9am Denver time, and the guard job skips it whenever the
# routine's run already delivered today's brief.
# Note: GitHub disables schedules after 60 days of repo inactivity (a manual
# run re-enables them).
on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch: {}   # on-demand runs + the cloud routine's primary trigger
  push:
    branches: [main]
    paths: [".github/trigger/daily-brief"]   # the routine's fallback trigger

permissions:
  contents: write          # needed to commit brief/state/ and brief/docs/ back

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  # Fallback dedup: the delayed cron must not redeliver (second email + push)
  # a brief the 11:00 UTC routine already sent. Non-schedule events (manual
  # dispatch, the routine's trigger) always deliver.
  guard:
    runs-on: ubuntu-latest
    outputs:
      deliver: ${{ steps.check.outputs.deliver }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deliver=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Match on the pipeline's LOCAL date (the bot commit message uses it
          # too): an evening manual run must not stamp "tomorrow" in UTC terms
          # and suppress the next morning's fallback.
          today=$(TZ="${{ vars.TIMEZONE || 'America/Denver' }}" date +%Y-%m-%d)
          since=$(date -u -d '18 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          # Fail OPEN (n=0 -> deliver) on API hiccups: a rare duplicate brief
          # beats silently skipping the only delivery of the day.
          n=$(gh api "repos/${GITHUB_REPOSITORY}/commits?since=${since}&per_page=100" \
                --jq "[.[].commit.message | select(startswith(\"daily brief: ${today}\"))] | length" \
                || echo 0)
          [ -n "$n" ] || n=0
          if [ "$n" -gt 0 ]; then
            echo "brief already delivered today ($n bot commit(s)) — skipping the cron fallback"
            echo "deliver=false" >> "$GITHUB_OUTPUT"
          else
            echo "deliver=true" >> "$GITHUB_OUTPUT"
          fi

  brief:
    needs: guard
    if: needs.guard.outputs.deliver == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brief   # the pipeline lives under brief/; all its paths are CWD-relative
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brief/requirements.txt

      # Read-only, sparse (only the daily-notes folder) checkout of the private
      # Obsidian vault, so the podcast can open with a recap of recent work.
      # continue-on-error: a vault hiccup must never block the brief.
      # (checkout paths are workspace-relative, so brief/ must be explicit here)
      - name: Check out Obsidian daily notes (read-only, sparse)
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: TaniMasanori/obsidian
          ssh-key: ${{ secrets.OBSIDIAN_DEPLOY_KEY }}
          sparse-checkout: 10_Daily
          sparse-checkout-cone-mode: false
          path: brief/_obsidian

      - name: Install a Japanese-capable font (for the slide PDF)
        run: sudo apt-get update && sudo apt-get install -y fonts-ipafont-gothic

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the daily brief
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
          AUTOCONTENT_API_KEY: ${{ secrets.AUTOCONTENT_API_KEY }}
          PHASE: ${{ vars.PHASE || '2' }}
          GMAIL_QUERY: ${{ vars.GMAIL_QUERY }}
          # Empty by default: personal inbox mail is not collected, so it never
          # enters the publicly-hosted podcast. Set the GMAIL_OTHER_QUERY repo
          # variable to opt back in.
          GMAIL_OTHER_QUERY: ${{ vars.GMAIL_OTHER_QUERY }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Denver' }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
          PODCAST_TITLE: ${{ vars.PODCAST_TITLE || 'Daily Research Brief' }}
          PODCAST_AUTHOR: ${{ vars.PODCAST_AUTHOR || 'Me' }}
          PODCAST_LANGUAGE: ${{ vars.PODCAST_LANGUAGE || 'ja' }}
          EPISODE_RETENTION: ${{ vars.EPISODE_RETENTION || '1' }}
          REDACT_NAMES: ${{ vars.REDACT_NAMES || 'Masanori,Tani' }}
          FONT_PATH: /usr/share/fonts/opentype/ipafont-gothic/ipagp.ttf
          # Training-app integration: encrypted newsletter bundle (brief/docs/brief.enc).
          # Empty BRIEF_ENC_KEY disables the bundle + push entirely.
          BRIEF_ENC_KEY: ${{ secrets.BRIEF_ENC_KEY }}
          NATURE_DIGEST_QUERY: ${{ vars.NATURE_DIGEST_QUERY || 'in:draft subject:"Nature Daily Brief" newer_than:1d' }}
          TRAINING_APP_URL: ${{ vars.TRAINING_APP_URL || 'https://tanimasanori.github.io/ccc2031-training/' }}
          # Recap of recent work from the Obsidian daily notes checked out above.
          # If the checkout failed, this dir lacks 10_Daily and the recap is
          # skipped gracefully.
          OBSIDIAN_DIR: _obsidian
          OBSIDIAN_DAILY_SUBDIR: ${{ vars.OBSIDIAN_DAILY_SUBDIR || '10_Daily' }}
          OBSIDIAN_LOOKBACK_DAYS: ${{ vars.OBSIDIAN_LOOKBACK_DAYS || '2' }}
        run: python -m src.main

      - name: Commit updated state and podcast feed
        run: |
          git config user.name  "daily-brief-bot"
          git config user.email "actions@github.com"
          # Never commit plaintext audio: only the encrypted *.mp3.enc belongs
          # on public Pages. A failed encrypt_audio can leave the raw MP3 here.
          find docs/audio -name '*.mp3' -delete 2>/dev/null || true
          git add state/ docs/
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            # Local (pipeline-timezone) date, matching the guard job's dedup
            # key — a UTC date would roll over at 18:00 Denver and make an
            # evening test run suppress the NEXT day's cron fallback.
            git commit -m "daily brief: $(TZ="${{ vars.TIMEZONE || 'America/Denver' }}" date +%Y-%m-%d)"
            # Rebase onto whatever landed on main since checkout (e.g. a
            # manual commit during a workflow_dispatch test run) before
            # pushing, so an unrelated race doesn't drop this run's output.
            git fetch origin main
            git rebase origin/main
            git push
          fi

      # After the commit so the fresh brief.enc is already deploying to Pages
      # when the phone buzzes. Skips itself when push isn't configured or the
      # bundle wasn't published this run (no out/push_payload.json).
      - name: Send morning push notification
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          PUSH_CLAIMS_EMAIL: ${{ vars.PUSH_CLAIMS_EMAIL || 'masanori.tani.t@gmail.com' }}
        run: |
          if [ -f out/push_payload.json ]; then
            sleep 90   # give the Pages build a moment to serve the new brief
          fi
          python -m src.push
